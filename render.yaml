services:
  - type: web
    name: hurrair-vip-trading-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hurrair-vip-trading-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL
        value: "@hurrairtrading"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: EXNESS_PARTNER_LINK
        value: "https://one.exnessonelink.com/a/i2cmzyptz3"

databases:
  - name: hurrair-vip-trading-db
    databaseName: hurrair_vip_trading
    user: hurrair_vip_trading
