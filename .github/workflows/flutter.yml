name: Flutter

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios --project-name hurrair_vip_trading .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
