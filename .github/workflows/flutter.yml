name: Flutter

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.trading --platforms=android,ios --project-name hurrair_vip_trading .
      - run: flutter pub get
      - run: dart run tool/configure_android_notifications.dart
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
          --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}
          --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: hurrair-vip-trading-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
